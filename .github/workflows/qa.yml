name: Tracker QA

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  migration:
    name: Alembic upgrade smoke
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dota_report_card
          POSTGRES_USER: dota
          POSTGRES_PASSWORD: dota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dota -d dota_report_card"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://dota:dota@localhost:5432/dota_report_card
      - name: Tracker schema and migration regressions
        run: uv run pytest -q tests/integration/test_postgres_migrations.py tests/tracker
        env:
          RUN_POSTGRES_MIGRATION_TEST: "1"
          TEST_POSTGRES_URL: postgresql+psycopg://dota:dota@localhost:5432/dota_report_card
          TEST_REDIS_URL: redis://localhost:6379/0

  backend:
    name: Backend contract and regression QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check services/api tests scripts
      - run: uv run mypy
      - run: make test
      - run: make docs-check
