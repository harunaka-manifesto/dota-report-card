services:
  migrate:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://dota:dota@postgres:5432/dota_report_card
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: production
      OPENDOTA_SOURCE: live
      OPENDOTA_BASE_URL: ${OPENDOTA_BASE_URL-https://api.opendota.com/api}
      OPENDOTA_API_KEY: ${OPENDOTA_API_KEY-}
      STEAM_API_KEY: ${STEAM_API_KEY-}
      DATABASE_URL: postgresql+psycopg://dota:dota@postgres:5432/dota_report_card
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS-http://localhost:3000}
      STORAGE_BACKEND: database
      ANALYSIS_EXECUTION_BACKEND: celery
      FREE_DNA_V6_ENABLED: ${FREE_DNA_V6_ENABLED-false}
      FREE_DNA_V6_BASELINE_ARTIFACT: /app/services/api/artifacts/free_dna_v6/6.0.0/context-baseline-2.0.0.json
      FREE_DNA_V6_THRESHOLD_ARTIFACT: /app/services/api/artifacts/free_dna_v6/6.0.0/metric-thresholds-6.0.0.json
      FREE_DNA_V6_MODEL_VERSION: free-dna-model-6.0.0
      FREE_DNA_V61_ENABLED: ${FREE_DNA_V61_ENABLED-false}
      FREE_DNA_V61_SHADOW_ENABLED: ${FREE_DNA_V61_SHADOW_ENABLED-false}
      FREE_DNA_V61_EXPERIMENTAL_EVOLUTION_ENABLED: ${FREE_DNA_V61_EXPERIMENTAL_EVOLUTION_ENABLED-false}
      FREE_DNA_V61_EXPERIMENTAL_LOOPS_ENABLED: ${FREE_DNA_V61_EXPERIMENTAL_LOOPS_ENABLED-false}
      FREE_DNA_V61_ARTIFACT_DIR: /app/runtime-artifacts/free_dna_v61/6.1.0
      FREE_DNA_V61_BASELINE_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/context-baseline-3.0.0.json
      FREE_DNA_V61_THRESHOLD_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/metric-thresholds-6.1.0.json
      FREE_DNA_V61_RELEASE_AUTHORIZATION: /app/runtime-artifacts/free_dna_v61/6.1.0/production-beta-authorization-6.1.0.json
      FREE_DNA_V61_SUMMARY_PRIOR_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/summary-priors-6.1.0.json
      FREE_DNA_V61_DISTANCE_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/portfolio-distance-calibration-1.0.0.json
      FREE_DNA_V61_SESSION_RELIABILITY_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/session-reliability-calibration-1.0.0.json
      FREE_DNA_V61_SEMANTIC_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/semantic-outcome-calibration-1.0.0.json
      FREE_DNA_V61_BUILD_MANIFEST: /app/runtime-artifacts/free_dna_v61/6.1.0/build-manifest-6.1.0.json
      FREE_DNA_V61_MODEL_VERSION: free-dna-model-6.1.0
      FREE_DNA_V61_ANALYTICAL_SOURCE_SHA: ${FREE_DNA_V61_ANALYTICAL_SOURCE_SHA-}
      RELEASE_COMMIT_SHA: ${RELEASE_COMMIT_SHA-}
      RELEASE_WORKTREE_DIRTY: ${RELEASE_WORKTREE_DIRTY-false}
      REPORT_RETENTION_DAYS: 30
    volumes:
      - ${FREE_DNA_V61_ARTIFACT_HOST_DIR:-./runtime-artifacts/free_dna_v61/6.1.0}:/app/runtime-artifacts/free_dna_v61/6.1.0:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    command: celery -A app.workers.tasks.celery_app worker --loglevel=INFO
    environment:
      APP_ENV: production
      OPENDOTA_SOURCE: live
      OPENDOTA_BASE_URL: ${OPENDOTA_BASE_URL-https://api.opendota.com/api}
      OPENDOTA_API_KEY: ${OPENDOTA_API_KEY-}
      STEAM_API_KEY: ${STEAM_API_KEY-}
      DATABASE_URL: postgresql+psycopg://dota:dota@postgres:5432/dota_report_card
      REDIS_URL: redis://redis:6379/0
      FREE_DNA_V6_ENABLED: ${FREE_DNA_V6_ENABLED-false}
      FREE_DNA_V6_BASELINE_ARTIFACT: /app/services/api/artifacts/free_dna_v6/6.0.0/context-baseline-2.0.0.json
      FREE_DNA_V6_THRESHOLD_ARTIFACT: /app/services/api/artifacts/free_dna_v6/6.0.0/metric-thresholds-6.0.0.json
      FREE_DNA_V6_MODEL_VERSION: free-dna-model-6.0.0
      FREE_DNA_V61_ENABLED: ${FREE_DNA_V61_ENABLED-false}
      FREE_DNA_V61_SHADOW_ENABLED: ${FREE_DNA_V61_SHADOW_ENABLED-false}
      FREE_DNA_V61_EXPERIMENTAL_EVOLUTION_ENABLED: ${FREE_DNA_V61_EXPERIMENTAL_EVOLUTION_ENABLED-false}
      FREE_DNA_V61_EXPERIMENTAL_LOOPS_ENABLED: ${FREE_DNA_V61_EXPERIMENTAL_LOOPS_ENABLED-false}
      FREE_DNA_V61_ARTIFACT_DIR: /app/runtime-artifacts/free_dna_v61/6.1.0
      FREE_DNA_V61_BASELINE_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/context-baseline-3.0.0.json
      FREE_DNA_V61_THRESHOLD_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/metric-thresholds-6.1.0.json
      FREE_DNA_V61_RELEASE_AUTHORIZATION: /app/runtime-artifacts/free_dna_v61/6.1.0/production-beta-authorization-6.1.0.json
      FREE_DNA_V61_SUMMARY_PRIOR_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/summary-priors-6.1.0.json
      FREE_DNA_V61_DISTANCE_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/portfolio-distance-calibration-1.0.0.json
      FREE_DNA_V61_SESSION_RELIABILITY_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/session-reliability-calibration-1.0.0.json
      FREE_DNA_V61_SEMANTIC_ARTIFACT: /app/runtime-artifacts/free_dna_v61/6.1.0/semantic-outcome-calibration-1.0.0.json
      FREE_DNA_V61_BUILD_MANIFEST: /app/runtime-artifacts/free_dna_v61/6.1.0/build-manifest-6.1.0.json
      FREE_DNA_V61_MODEL_VERSION: free-dna-model-6.1.0
      FREE_DNA_V61_ANALYTICAL_SOURCE_SHA: ${FREE_DNA_V61_ANALYTICAL_SOURCE_SHA-}
      RELEASE_COMMIT_SHA: ${RELEASE_COMMIT_SHA-}
      RELEASE_WORKTREE_DIRTY: ${RELEASE_WORKTREE_DIRTY-false}
      REPORT_RETENTION_DAYS: 30
      STORAGE_BACKEND: database
      ANALYSIS_EXECUTION_BACKEND: celery
    volumes:
      - ${FREE_DNA_V61_ARTIFACT_HOST_DIR:-./runtime-artifacts/free_dna_v61/6.1.0}:/app/runtime-artifacts/free_dna_v61/6.1.0:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL-http://api:8000}
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dota_report_card
      POSTGRES_USER: dota
      POSTGRES_PASSWORD: dota
    ports:
      - "5432:5432"
    volumes:
      - dota-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dota -d dota_report_card"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dota-postgres:
